<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean 1 Textbook</title>
  <script>
    (function(){
      try {
        var f=parseFloat(localStorage.getItem("koreanFontScale"));
        if(!isNaN(f)){f=Math.round(Math.min(1.8,Math.max(0.8,f))*100)/100;document.documentElement.style.setProperty("--font-scale",String(f));}
        var t=localStorage.getItem("koreanTheme");
        if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t);
      } catch(e){}
    }());
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-scale: 1;
      --bg: #f8fafc; --card: #fff; --snav-bg: #f1f5f9;
      --fg: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --sep: #f1f5f9;
      --sbtn-bg: #fff; --sbtn-border: #cbd5e1; --sbtn-text: #64748b;
      --sbtn-active-bg: #1e293b; --sbtn-active-border: #1e293b; --sbtn-active-text: #fff;
      --pall-border: #1e293b; --pall-text: #1e293b; --pall-active-bg: #1e293b; --pall-active-text: #fff;
    }
    html[data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --snav-bg: #1e293b;
      --fg: #e2e8f0; --muted: #94a3b8;
      --border: #334155; --sep: #0f172a;
      --sbtn-bg: #1e293b; --sbtn-border: #334155; --sbtn-text: #94a3b8;
      --sbtn-active-bg: #3b82f6; --sbtn-active-border: #3b82f6; --sbtn-active-text: #fff;
      --pall-border: #475569; --pall-text: #e2e8f0; --pall-active-bg: #475569; --pall-active-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --bg: #0f172a; --card: #1e293b; --snav-bg: #1e293b;
        --fg: #e2e8f0; --muted: #94a3b8;
        --border: #334155; --sep: #0f172a;
        --sbtn-bg: #1e293b; --sbtn-border: #334155; --sbtn-text: #94a3b8;
        --sbtn-active-bg: #3b82f6; --sbtn-active-border: #3b82f6; --sbtn-active-text: #fff;
        --pall-border: #475569; --pall-text: #e2e8f0; --pall-active-bg: #475569; --pall-active-text: #fff;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); font-size: calc(16px * var(--font-scale)); }
    .nav-wrapper { display: flex; align-items: center; background: #1e293b; }
    .lesson-nav { display: flex; gap: 4px; padding: 10px 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; flex: 1; }
    .lesson-nav::-webkit-scrollbar { display: none; }
    .nav-controls { padding: 0 10px; flex-shrink: 0; position: relative; }
    .lesson-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; background: #334155; color: #94a3b8; white-space: nowrap; }
    .lesson-btn.active { background: #3b82f6; color: #fff; }
    .lesson-header { padding: 18px 16px 6px; }
    .lesson-title { font-size: 1.25em; font-weight: 700; }
    .section-nav { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--snav-bg); border-bottom: 1px solid var(--border); }
    .section-tabs { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; }
    .section-tabs::-webkit-scrollbar { display: none; }
    .section-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    @media (max-width: 600px) {
      .section-nav { flex-wrap: wrap; row-gap: 8px; }
      .section-tabs { flex: 1 0 100%; }
      .section-actions { flex: 1 0 100%; }
      .section-actions .bar-btn { flex: 1; padding: 8px 6px; text-align: center; }
    }
    .bar-btn { padding: 6px 12px; border: 1px solid var(--pall-border); border-radius: 20px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; background: transparent; color: var(--pall-text); white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .bar-btn:active { background: var(--pall-active-bg); color: var(--pall-active-text); }
    .bar-btn.looping { background: var(--pall-active-bg); color: var(--pall-active-text); }
    #stop-bar-btn { display: none; border-color: #dc2626; background: #dc2626; color: #fff; }
    #stop-bar-btn.visible { display: inline-block; }
    #stop-bar-btn:active { background: #b91c1c; border-color: #b91c1c; }
    @media (hover: hover) { .bar-btn:hover { background: var(--pall-active-bg); color: var(--pall-active-text); } #stop-bar-btn:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; } }
    .section-btn { padding: 6px 14px; border: 1px solid var(--sbtn-border); border-radius: 20px; cursor: pointer; font-size: 13px; background: var(--sbtn-bg); color: var(--sbtn-text); white-space: nowrap; }
    .section-btn.active { background: var(--sbtn-active-bg); color: var(--sbtn-active-text); border-color: var(--sbtn-active-border); }
    .section-content { padding: 14px 16px 32px; }
    .section-header { margin-bottom: 16px; }
    .section-label { font-size: 0.7em; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.08em; }
    .section-title { font-size: 1.125em; font-weight: 700; margin-top: 3px; }
    .speaker-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .speaker-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .speaker-name { font-weight: 700; font-size: 0.9375em; display: flex; align-items: center; gap: 8px; }
    .speaker-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .play-turn-btn { padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8125em; font-weight: 600; background: transparent; min-height: 38px; min-width: 120px; text-align: center; }
    .line-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; }
    .line-row + .line-row { border-top: 1px solid var(--sep); }
    .line-text { font-size: 1.0625em; flex: 1; line-height: 1.4; }
    .play-line-btn { padding: 7px 16px; border: none; border-radius: 20px; cursor: pointer; font-size: 0.8125em; font-weight: 600; min-height: 38px; min-width: 120px; text-align: center; margin-left: 12px; flex-shrink: 0; color: #fff; }
    @media (hover: hover) {
      .lesson-btn:hover:not(.active) { background: #475569; }
    }
    /* Controls dropdown (font + theme) */
    .font-dropdown { position: relative; flex-shrink: 0; }
    .font-dropdown summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 44px; min-height: 36px; padding: 5px 9px; border: 1px solid #475569; border-radius: 8px; background: #334155; color: #e2e8f0; -webkit-tap-highlight-color: transparent; user-select: none; }
    .font-dropdown summary::-webkit-details-marker { display: none; }
    .font-summary-aa { font-size: 13px; font-weight: 700; letter-spacing: -0.03em; }
    .font-summary-arrow { font-size: 10px; color: #94a3b8; line-height: 1; }
    .font-dropdown[open] summary { background: #475569; }
    .font-dropdown[open] .font-summary-arrow { display: inline-block; transform: rotate(180deg); }
    .font-dropdown-panel { position: absolute; right: 0; top: 100%; margin-top: 6px; padding: 10px 11px; background: #1e293b; border: 1px solid #475569; border-radius: 8px; z-index: 20; min-width: 196px; }
    .ctrl-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .ctrl-row + .ctrl-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid #334155; }
    .ctrl-row button { min-width: 44px; min-height: 36px; padding: 5px 8px; font: inherit; font-size: 13px; font-weight: 700; line-height: 1; border: 1px solid #475569; border-radius: 8px; background: #334155; color: #e2e8f0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ctrl-row button:active, .ctrl-row button.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .ctrl-row button:disabled { opacity: 0.35; cursor: not-allowed; }
    .ctrl-label { font-size: 11px; font-weight: 500; color: #94a3b8; margin-right: 2px; user-select: none; min-width: 36px; text-align: right; }
    #stop-fab { position: fixed; right: 16px; bottom: 20px; z-index: 50; display: none; align-items: center; gap: 6px; padding: 13px 22px; border: none; border-radius: 26px; font: inherit; font-size: 15px; font-weight: 700; color: #fff; background: #dc2626; box-shadow: 0 4px 14px rgba(0,0,0,0.35); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #stop-fab.visible { display: flex; }
    #stop-fab:active { background: #b91c1c; }
  </style>
</head>

// Rows (1-based, per section) whose clips are one utterance and play as one row.
// Key: "<lesson index>.<section index>"  (sections are C1, C2, Narration).
const MERGES = {
  "0.1": [[7,8]],
  "1.1": [[1,2]],
  "1.2": [[1,2],[8,9]],
  "2.0": [[1,2]],
  "2.1": [[1,2],[3,4],[9,10],[12,13]],
  "3.0": [[1,2],[9,10],[15,16]],
  "3.1": [[1,2],[5,6],[8,9],[12,13]],
  "4.1": [[1,2],[13,14]],
  "5.0": [[1,2]],
  "5.1": [[2,3],[8,9],[11,12]],
  "6.0": [[2,3,4],[5,6],[11,12],[16,17]],
  "6.1": [[2,3],[8,9],[11,12]]
};

function applyMerges() {
  LESSONS.forEach((lesson, li) => {
    lesson.sections.forEach((sec, si) => {
      const groups = MERGES[`${li}.${si}`];
      if (!groups) return;
      const drop = new Set();
      for (const g of groups) {
        const first = sec.lines[g[0] - 1];
        if (!first) continue;
        first.files = g.map(r => sec.lines[r - 1]).filter(Boolean).map(l => l.file);
        first.text = g.map(r => sec.lines[r - 1]).filter(Boolean).map(l => l.text).join(' ');
        g.slice(1).forEach(r => drop.add(r - 1));
      }
      sec.lines = sec.lines.filter((_, i) => !drop.has(i));
    });
  });
}
applyMerges();

const COLORS = {
  '스티브': '#3b82f6',
  '유미':   '#16a34a',
  '마이클': '#d97706',
  '소피아': '#9333ea',
  '리사':   '#0891b2',
  '제니':   '#e11d48',
  '나레이터': '#64748b'
};

let currentAudio = null;
let playQueue = [];
const BLOBS = new Map();   // path -> object URL (current section only)
let prefetchToken = 0;
let loopSource = null;
let loopKey = null;
let playToken = 0;
let playing = false;
let pendingTimer = null;
const LINE_GAP = 400;
const MERGE_GAP = 500;  // pause between clips inside one merged row
const LOOP_GAP = 3000;
const REG = {};

function later(ms, token) {
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => { if (token === playToken) playNext(); }, ms);
}

function stop() {
  playToken++;
  clearTimeout(pendingTimer);
  pendingTimer = null;
  if (currentAudio) { currentAudio.pause(); currentAudio.onended = null; currentAudio.onerror = null; }
  playQueue = [];
  loopSource = null;
  loopKey = null;
  playing = false;
  syncLoopBtn();
  syncStopFab();
}

// Single reusable element: on iOS/Android only an element unlocked by a user
// gesture plays without delay, so we keep one and swap its src.
function getPlayer() {
  if (!currentAudio) {
    currentAudio = new Audio();
    currentAudio.preload = 'auto';
  }
  return currentAudio;
}

function srcFor(path) { return BLOBS.get(path) || path; }

function clearBlobs() {
  for (const url of BLOBS.values()) URL.revokeObjectURL(url);
  BLOBS.clear();
}

// Pull every clip for the active section into memory so playback between
// lines is instant instead of a network round-trip per file.
async function prefetchSection(paths) {
  prefetchToken++;
  const token = prefetchToken;
  clearBlobs();
  const queue = [...new Set(paths)];
  const worker = async () => {
    while (queue.length) {
      if (token !== prefetchToken) return;
      const path = queue.shift();
      try {
        const res = await fetch(path);
        if (!res.ok) continue;
        const blob = await res.blob();
        if (token !== prefetchToken) return;
        BLOBS.set(path, URL.createObjectURL(blob));
      } catch (e) { /* fall back to the network path */ }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}

function playNext() {
  const token = playToken;
  if (!playQueue.length) {
    if (!loopSource) { playing = false; syncStopFab(); return; }
    playQueue = [...loopSource];
    later(LOOP_GAP - LINE_GAP, token);
    return;
  }
  const item = playQueue.shift();
  const a = getPlayer();
  a.onended = () => later(item.gap, token);
  a.onerror = () => later(100, token);
  a.src = srcFor(item.src);
  a.play().catch(() => later(100, token));
}

// Flatten lines into playback items; clips inside a merged row get the short gap.
function entriesFor(dir, lines) {
  const out = [];
  for (const line of lines) {
    const files = line.files || [line.file];
    files.forEach((f, i) => {
      out.push({ src: `audio/${dir}/${f}`, gap: i < files.length - 1 ? MERGE_GAP : LINE_GAP });
    });
  }
  return out;
}

function playFiles(paths) {
  stop();
  playQueue = [...paths];
  playing = true;
  syncStopFab();
  playNext();
}

function playReg(id) { playFiles(REG[id]); }

function syncStopFab() {
  const fab = document.getElementById('stop-fab');
  if (fab) fab.classList.toggle('visible', playing);
  const bar = document.getElementById('stop-bar-btn');
  if (bar) bar.classList.toggle('visible', playing);
}

function syncLoopBtn() {
  const btn = document.getElementById('loop-all-btn');
  if (!btn) return;
  const on = !!loopKey;
  btn.classList.toggle('looping', on);
  btn.textContent = on ? '■ Stop Loop' : '↻ Loop All';
}

function toggleLoop(id) {
  if (loopKey === id) { stop(); return; }
  playFiles(REG[id]);
  loopSource = [...REG[id]];
  loopKey = id;
  syncLoopBtn();
}

function buildBlocks(lines) {
  const blocks = [];
  let cur = null;
  for (const line of lines) {
    if (!cur || cur.speaker !== line.speaker) {
      cur = { speaker: line.speaker, lines: [] };
      blocks.push(cur);
    }
    cur.lines.push(line);
  }
  return blocks;
}

let activeLesson = 0;
let activeSection = 0;

function render() {
  const app = document.getElementById('app');

  // Lesson nav
  let html = '<div class="nav-wrapper"><nav class="lesson-nav">';
  LESSONS.forEach((l, i) => {
    html += `<button class="lesson-btn${i===activeLesson?' active':''}" onclick="setLesson(${i})">Lesson ${i+1}</button>`;
  });
  html += `</nav><div class="nav-controls">
  <details class="font-dropdown" id="font-dropdown">
    <summary title="Display settings">
      <span class="font-summary-aa">Aa</span>
      <span class="font-summary-arrow">▾</span>
    </summary>
    <div class="font-dropdown-panel">
      <div class="ctrl-row">
        <span class="ctrl-label" id="font-pct"></span>
        <button type="button" id="font-smaller" title="Smaller text">A−</button>
        <button type="button" id="font-reset" title="Default text size">A</button>
        <button type="button" id="font-larger" title="Larger text">A+</button>
      </div>
      <div class="ctrl-row">
        <button type="button" id="theme-light">Light</button>
        <button type="button" id="theme-system">System</button>
        <button type="button" id="theme-dark">Dark</button>
      </div>
    </div>
  </details>
  </div></div>`;

  const lesson = LESSONS[activeLesson];
  html += `<div class="lesson-header"><div class="lesson-title">${lesson.title}</div></div>`;

  // Section nav
  html += '<div class="section-nav"><div class="section-tabs">';
  lesson.sections.forEach((s, i) => {
    html += `<button class="section-btn${i===activeSection?' active':''}" onclick="setSection(${i})">${s.label}</button>`;
  });
  html += '</div><div class="section-actions">';
  html += `<button class="bar-btn" onclick="playReg('a_${activeLesson}_${activeSection}')">▶ Play All</button>`;
  html += `<button class="bar-btn" id="loop-all-btn" onclick="toggleLoop('a_${activeLesson}_${activeSection}')">↻ Loop All</button>`;
  html += `<button class="bar-btn" id="stop-bar-btn" onclick="stop()">■ Stop</button>`;
  html += '</div></div>';

  const sec = lesson.sections[activeSection];
  html += '<div class="section-content">';
  html += `<div class="section-header"><div class="section-label">${sec.label}</div><div class="section-title">${sec.title}</div></div>`;

  const blocks = buildBlocks(sec.lines);
  const allKey = `a_${activeLesson}_${activeSection}`;
  REG[allKey] = entriesFor(sec.dir, sec.lines);

  blocks.forEach((block, bi) => {
    const color = COLORS[block.speaker] || '#64748b';
    const turnKey = `t_${activeLesson}_${activeSection}_${bi}`;
    REG[turnKey] = entriesFor(sec.dir, block.lines);

    html += `<div class="speaker-block">`;
    html += `<div class="speaker-header">`;
    html += `<div class="speaker-name"><span class="speaker-dot" style="background:${color}"></span><span style="color:${color}">${block.speaker}</span></div>`;
    html += `<button class="play-turn-btn" style="color:${color};border-color:${color}" onclick="playReg('${turnKey}')">▶ Play Turn</button>`;
    html += `</div>`;

    block.lines.forEach((line, li) => {
      const lineKey = `l_${activeLesson}_${activeSection}_${bi}_${li}`;
      REG[lineKey] = entriesFor(sec.dir, [line]);
      html += `<div class="line-row">`;
      html += `<div class="line-text">${line.text}</div>`;
      html += `<button class="play-line-btn" style="background:${color}" onclick="playReg('${lineKey}')">▶</button>`;
      html += `</div>`;
    });
    html += `</div>`;
  });

  html += '</div>';

  app.innerHTML = html;
  syncLoopBtn();
  syncStopFab();
  prefetchSection(REG[allKey].map(e => e.src));
}

function setLesson(i) { activeLesson = i; activeSection = 0; stop(); render(); controlsInit(); }
function setSection(i) { activeSection = i; stop(); render(); controlsInit(); }

render();

(function(){
  // Font
  var FK="koreanFontScale", FDEF=1, FMIN=0.8, FMAX=1.8, FSTEP=0.1;
  function frd(x){ return Math.round(x*100)/100; }
  function fget(){ var v=parseFloat(localStorage.getItem(FK)); return isNaN(v)?FDEF:frd(Math.min(FMAX,Math.max(FMIN,v))); }
  function fapply(s){
    s=frd(Math.min(FMAX,Math.max(FMIN,s)));
    document.documentElement.style.setProperty("--font-scale",String(s));
    try{ localStorage.setItem(FK,String(s)); }catch(e){}
    var pct=document.getElementById("font-pct");
    var sm=document.getElementById("font-smaller");
    var lg=document.getElementById("font-larger");
    if(pct) pct.textContent=Math.round(s*100)+"%";
    if(sm) sm.disabled=s<=FMIN+0.001;
    if(lg) lg.disabled=s>=FMAX-0.001;
  }

  // Theme
  var TK="koreanTheme";
  function tget(){ return localStorage.getItem(TK)||"system"; }
  function tapply(t){
    try{ localStorage.setItem(TK,t); }catch(e){}
    if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    else if(t==="light") document.documentElement.setAttribute("data-theme","light");
    else document.documentElement.removeAttribute("data-theme");
    ["light","system","dark"].forEach(function(x){
      var b=document.getElementById("theme-"+x);
      if(b){ b.classList.toggle("active", x===t); }
    });
  }

  function close(){ var d=document.getElementById("font-dropdown"); if(d) d.removeAttribute("open"); }

  window.controlsInit = function(){
    fapply(fget());
    tapply(tget());
    var sm=document.getElementById("font-smaller");
    var rs=document.getElementById("font-reset");
    var lg=document.getElementById("font-larger");
    if(sm) sm.onclick=function(e){ e.preventDefault(); fapply(fget()-FSTEP); };
    if(rs) rs.onclick=function(e){ e.preventDefault(); fapply(FDEF); };
    if(lg) lg.onclick=function(e){ e.preventDefault(); fapply(fget()+FSTEP); };
    ["light","system","dark"].forEach(function(x){
      var b=document.getElementById("theme-"+x);
      if(b) b.onclick=function(e){ e.preventDefault(); tapply(x); };
    });
  };
  controlsInit();
})();
</script>
