// Rows (1-based, per section) whose clips are one utterance and play as one row.
// Key: "<lesson index>.<section index>"  (sections are C1, C2, Narration).
const MERGES = {
  "0.1": [[7,8]],
  "1.1": [[1,2]],
  "1.2": [[1,2],[8,9]],
  "2.0": [[1,2]],
  "2.1": [[1,2],[3,4],[9,10],[12,13]],
  "3.0": [[1,2],[9,10],[15,16]],
  "3.1": [[1,2],[5,6],[8,9],[12,13]],
  "4.1": [[1,2],[13,14]],
  "5.0": [[1,2]],
  "5.1": [[2,3],[8,9],[11,12]],
  "6.0": [[2,3,4],[5,6],[11,12],[16,17]],
  "6.1": [[2,3],[8,9],[11,12]]
};

function applyMerges() {
  LESSONS.forEach((lesson, li) => {
    lesson.sections.forEach((sec, si) => {
      const groups = MERGES[`${li}.${si}`];
      if (!groups) return;
      const drop = new Set();
      for (const g of groups) {
        const first = sec.lines[g[0] - 1];
        if (!first) continue;
        first.files = g.map(r => sec.lines[r - 1]).filter(Boolean).map(l => l.file);
        first.text = g.map(r => sec.lines[r - 1]).filter(Boolean).map(l => l.text).join(' ');
        first.en = g.map(r => sec.lines[r - 1]).filter(Boolean).map(l => l.en).filter(Boolean).join(' ');
        g.slice(1).forEach(r => drop.add(r - 1));
      }
      sec.lines = sec.lines.filter((_, i) => !drop.has(i));
    });
  });
}
applyMerges();

const LOOKUP_SUFFIXES = [
  '이었었어요','재미있었어요','어려웠어요','일어났어요','바빴어요','많았어요',
  '없었어요','있었어요','수영했어요','오래간만이에요','오랜만이에요',
  '선생님이세요','좋으세요','있으세요','보내세요','아니에요',
  '이에요','예요','입니다','습니까','으세요','세요',
  '았어요','었어요','했어요','아요','어요','해요',
  '에서','에게','한테','으로','부터','까지',  '하고','이랑','들은',
  '은','는','이','가','을','를','에','의','도','만','와','과','로','랑','께','요'
].sort((a, b) => b.length - a.length);

function lookupWord(raw) {
  const word = String(raw || '').replace(/[.?…,!]+$/g, '').trim();
  if (!word) return null;
  if (DICT[word]) return { word, lemma: word, gloss: DICT[word] };
  for (let i = 1; i < word.length; i++) {
    const stem = word.slice(0, -i);
    if (DICT[stem]) return { word, lemma: stem, gloss: DICT[stem] };
  }
  for (const suf of LOOKUP_SUFFIXES) {
    if (word.length > suf.length && word.endsWith(suf)) {
      const stem = word.slice(0, -suf.length);
      if (DICT[stem]) return { word, lemma: stem, gloss: DICT[stem] };
    }
  }
  return { word, lemma: null, gloss: null };
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

function renderLineText(text) {
  return String(text).split(/(\s+)/).map(tok => {
    if (/^\s+$/.test(tok)) return tok;
    const clean = tok.replace(/[.?…,!]+$/,'');
    const punct = tok.slice(clean.length);
    if (!clean) return escHtml(tok);
    return '<button type="button" class="word-tok" data-word="' + escHtml(clean) + '">' + escHtml(clean) + '</button>' + escHtml(punct);
  }).join('');
}

let openTok = null;

function hideDefBubble() {
  const el = document.getElementById('def-bubble');
  if (el) { el.classList.remove('visible'); el.innerHTML = ''; }
  if (openTok) { openTok.setAttribute('aria-expanded', 'false'); openTok = null; }
}

function placeBubble(anchor) {
  const el = document.getElementById('def-bubble');
  if (!el) return;
  const close = document.getElementById('def-close');
  if (close) close.onclick = function(ev){ ev.stopPropagation(); hideDefBubble(); };
  const rect = anchor.getBoundingClientRect();
  const pad = 10;
  const bw = el.offsetWidth;
  const bh = el.offsetHeight;
  let left = rect.left + rect.width / 2 - bw / 2;
  left = Math.max(pad, Math.min(left, window.innerWidth - bw - pad));
  let top = rect.bottom + 8;
  if (top + bh > window.innerHeight - pad) top = Math.max(pad, rect.top - bh - 8);
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}

function openBubble(anchor, html) {
  const el = document.getElementById('def-bubble');
  if (!el) return;
  hideDefBubble();
  openTok = anchor;
  anchor.setAttribute('aria-expanded', 'true');
  el.innerHTML = '<button type="button" id="def-close" aria-label="Close">×</button>' + html;
  el.classList.add('visible');
  placeBubble(anchor);
}

function showDefBubble(anchor) {
  const word = anchor.getAttribute('data-word');
  const found = lookupWord(word);
  if (!found) return;
  let body = '<div class="def-word">' + escHtml(found.word) + '</div>';
  if (found.gloss) {
    if (found.lemma && found.lemma !== found.word) {
      body += '<div class="def-lemma">from ' + escHtml(found.lemma) + '</div>';
    }
    body += '<div class="def-gloss">' + escHtml(found.gloss) + '</div>';
  } else {
    body += '<div class="def-miss">No local definition for this form.</div>';
  }
  openBubble(anchor, body);
}

function showLineEn(anchor) {
  const en = anchor.getAttribute('data-en') || 'No translation yet.';
  openBubble(anchor, '<div class="def-word">' + escHtml(en) + '</div>');
}

function bindLookups() {
  document.querySelectorAll('.word-tok').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      if (openTok === btn) { hideDefBubble(); return; }
      showDefBubble(btn);
    });
  });
  document.querySelectorAll('.tr-line-btn').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      if (openTok === btn) { hideDefBubble(); return; }
      showLineEn(btn);
    });
  });
}

// #3 minimal: sticky lesson bar (CSS) + expandable search icon + invisible deep-links.
const SECTION_SLUGS = ['c1', 'c2', 'n'];
function sectionSlug(i) { return SECTION_SLUGS[i] || 'c1'; }
function hashFor(l, s) { return '#/lesson' + (l + 1) + '-' + sectionSlug(s); }
function parseHash() {
  try {
    const h = location.hash || '';
    const m = h.match(/#\/lesson([1-7])-(c1|c2|n)/i);
    if (!m) return null;
    const l = parseInt(m[1], 10) - 1;
    const s = SECTION_SLUGS.indexOf(m[2].toLowerCase());
    if (l < 0 || l > 6 || s < 0) return null;
    return { lesson: l, section: s };
  } catch(e){ return null; }
}
function updateHash() {
  try { history.replaceState(null, '', hashFor(activeLesson, activeSection)); } catch(e){}
}
let searchOpen = false;
function toggleSearch() {
  const bar = document.getElementById('search-bar');
  if (!bar) return;
  if (bar.hasAttribute('hidden')) {
    bar.removeAttribute('hidden');
    searchOpen = true;
    const inp = document.getElementById('search-input');
    if (inp) { doSearch(inp.value || ''); inp.focus(); }
  } else {
    closeSearch();
  }
}
function closeSearch() {
  const bar = document.getElementById('search-bar');
  if (bar) bar.setAttribute('hidden', '');
  searchOpen = false;
  const res = document.getElementById('search-results');
  if (res) res.innerHTML = '';
}
function doSearch(q) {
  const res = document.getElementById('search-results');
  if (!res) return;
  q = String(q || '').trim().toLowerCase();
  if (!q) { res.innerHTML = ''; return; }
  const out = [];
  LESSONS.forEach((lesson, li) => {
    lesson.sections.forEach((sec, si) => {
      sec.lines.forEach((line) => {
        const hay = String(line.text + ' ' + (line.en || '')).toLowerCase();
        if (hay.indexOf(q) !== -1) out.push({ li, si, line });
      });
    });
  });
  if (!out.length) { res.innerHTML = '<div class="search-empty">No matches.</div>'; return; }
  res.innerHTML = out.slice(0, 30).map((r, idx) => {
    const meta = 'Lesson ' + (r.li + 1) + ' / ' + escHtml(LESSONS[r.li].sections[r.si].label);
    return '<button type="button" class="search-result-item" data-idx="' + idx + '" data-l="' + r.li + '" data-s="' + r.si + '"><span class="search-result-meta">' + meta + '</span>' + escHtml(r.line.text) + '</button>';
  }).join('');
  res.querySelectorAll('.search-result-item').forEach(btn => {
    btn.onclick = function() {
      jumpToResult(parseInt(btn.getAttribute('data-l'), 10), parseInt(btn.getAttribute('data-s'), 10));
    };
  });
}
function jumpToResult(l, s) {
  if (!LESSONS[l] || !LESSONS[l].sections[s]) return;
  activeLesson = l;
  activeSection = s;
  stop();
  savePlace();
  render();
  controlsInit();
  updateHash();
  closeSearch();
  try { window.scrollTo(0, 0); } catch(e){}
}
function copyLessonLink() {
  try {
    updateHash();
    const url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(() => {});
    else {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  } catch(e){}
}

    const dur = isFinite(a.duration) ? a.duration : Infinity;
    let t = (a.currentTime || 0) + d;
    if (t < 0) t = 0;
    if (t > dur) t = dur;
    a.currentTime = t;
  } catch(e){}
}

  try {
    const a = getPlayer();
    if (!abLoop) {
      if (!a || !a.src) return;
      abLoop = true;
      abSrc = a.src;
    } else {
      abLoop = false;
      abSrc = null;
    }
    syncABBtn();
  } catch(e){}
}
function syncABBtn() {
  const b = document.getElementById('ab-btn');
  if (!b) return;
  b.classList.toggle('on', abLoop);
  b.textContent = abLoop ? 'Loop Line On' : 'Loop Line';
}
document.addEventListener('keydown', ev => {
  try {
    const tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); skipSeconds(-10); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); skipSeconds(10); }
    else if (ev.key === 'b' || ev.key === 'B') { toggleAB(); }
    else if (ev.key === '/') { ev.preventDefault(); toggleSearch(); }
    else if (ev.key === ' ') { ev.preventDefault(); togglePlayAll(); }
  } catch(e){}
});

function later(ms, token) {
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => { if (token === playToken) playNext(); }, ms);
}

function stop() {
  playToken++;
  clearTimeout(pendingTimer);
  pendingTimer = null;
  if (currentAudio) { currentAudio.pause(); currentAudio.onended = null; currentAudio.onerror = null; }
  playQueue = [];
  loopSource = null;
  loopKey = null;
  playing = false;
  playOrigin = null;
  playTurnKey = null;
  abLoop = false;
  abSrc = null;
  syncLoopBtn();
  syncPlayAllBtn();
  syncTurnBtns();
  syncABBtn();
  try { clearHighlight(); } catch(e){}
}

const SPEED_KEY = 'koreanPlayRate';
const SPEED_RATES = [0.75, 1, 1.25];

function getPlayRate() {
  try {
    const v = parseFloat(localStorage.getItem(SPEED_KEY));
    if (SPEED_RATES.indexOf(v) !== -1) return v;
  } catch (e) {}
  return 1;
}

function setPlayRate(r) {
  r = Number(r);
  if (SPEED_RATES.indexOf(r) === -1) r = 1;
  try { localStorage.setItem(SPEED_KEY, String(r)); } catch (e) {}
  if (currentAudio) currentAudio.playbackRate = r;
  syncSpeedMenu();
  const dd = document.getElementById('speed-dropdown');
  if (dd) dd.removeAttribute('open');
}

function applyPlayRate(a) {
  if (a) a.playbackRate = getPlayRate();
}

function syncSpeedMenu() {
  const rate = getPlayRate();
  document.querySelectorAll('#speed-dropdown-panel [data-rate]').forEach(btn => {
    btn.classList.toggle('active', Number(btn.getAttribute('data-rate')) === rate);
  });
}

function bindSpeedMenu() {
  const panel = document.getElementById('speed-dropdown-panel');
  if (!panel) return;
  panel.querySelectorAll('[data-rate]').forEach(btn => {
    btn.onclick = function(ev) {
      ev.preventDefault();
      setPlayRate(btn.getAttribute('data-rate'));
    };
  });
  syncSpeedMenu();
}

function getPlayer() {
  if (!currentAudio) {
    currentAudio = new Audio();
    currentAudio.preload = 'none';
  }
  applyPlayRate(currentAudio);
  return currentAudio;
}

function srcFor(path) { return BLOBS.get(path) || path; }

function clearBlobs() {
  for (const url of BLOBS.values()) { try { URL.revokeObjectURL(url); } catch(e){} }
  BLOBS.clear();
}

function shouldDeferPrefetch() {
  try {
    const c = navigator.connection || {};
    if (c.saveData) return true;
    if (String(c.effectiveType || '').indexOf('2g') !== -1) return true;
  } catch(e){}
  return false;
}

function storeBlob(path, blob) {
  if (BLOBS.has(path)) return;
  if (BLOBS.size >= BLOB_MAX) {
    const oldest = BLOBS.keys().next().value;
    try { URL.revokeObjectURL(BLOBS.get(oldest)); } catch(e){}
    BLOBS.delete(oldest);
  }
  try { BLOBS.set(path, URL.createObjectURL(blob)); } catch(e){}
}

async function fetchWithToken(queue, token) {
  const worker = async () => {
    while (queue.length) {
      if (token !== prefetchToken) return;
      const path = queue.shift();
      try {
        const res = await fetch(path);
        if (!res.ok) continue;
        const blob = await res.blob();
        if (token !== prefetchToken) return;
        storeBlob(path, blob);
      } catch (e) {}
      await new Promise(function(r){ setTimeout(r, 0); });
    }
  };
  await Promise.all([worker(), worker()]);
}

async function prefetchSection(paths) {
  const token = ++prefetchToken;
  const queue = [...new Set(paths)].filter(p => !BLOBS.has(p));
  return fetchWithToken(queue, token);
}

function warmSection(allEntries) {
  if (shouldDeferPrefetch()) return;
  const all = [...new Set(allEntries.map(e => e.src))].filter(p => !BLOBS.has(p));
  if (!all.length) return;
  const first = all.slice(0, 2);
  const rest = all.slice(2);
  const token = ++prefetchToken;
  fetchWithToken([...first], token).then(() => {
    if (token !== prefetchToken || !rest.length) return;
    const runRest = () => {
      if (token !== prefetchToken) return;
      fetchWithToken([...rest], token);
    };
    if ('requestIdleCallback' in window) requestIdleCallback(runRest, { timeout: 5000 });
    else setTimeout(runRest, 2000);
  });
}

function prefetchPath(path) {
  if (!path || BLOBS.has(path) || shouldDeferPrefetch()) return;
  fetch(path).then(r => r.ok ? r.blob() : null).then(b => { if (b) storeBlob(path, b); }).catch(() => {});
}

function entriesFor(dir, lines) {
  return entriesForWithKeys(dir, lines.map(l => ({ line: l, key: null })));
}
function entriesForWithKeys(dir, pairs) {
  const out = [];
  for (const { line, key } of pairs) {
    const files = line.files || [line.file];
    files.forEach((f, i) => {
      out.push({ src: `audio/${dir}/${f}`, gap: i < files.length - 1 ? MERGE_GAP : LINE_GAP, lineKey: key });
    });
  }
  return out;
}
function highlightLine(key) {
  document.querySelectorAll('.line-row.active-line').forEach(el => el.classList.remove('active-line'));
  if (!key) return;
  const el = document.querySelector('.line-row[data-line="' + key + '"]');
  if (el) {
    el.classList.add('active-line');
    try { el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' }); } catch(e){}
  }
}
function clearHighlight() {
  document.querySelectorAll('.line-row.active-line').forEach(el => el.classList.remove('active-line'));
}

function playNext() {
  const token = playToken;
  if (abLoop && abSrc) {
    const a = getPlayer();
    a.onended = () => later(300, token);
    a.onerror = () => later(100, token);
    a.src = abSrc;
    applyPlayRate(a);
    a.play().then(() => applyPlayRate(a)).catch(() => later(100, token));
    return;
  }
  if (!playQueue.length) {
    if (!loopSource) {
      const finishedOrigin = playOrigin;
      playing = false; playOrigin = null; playTurnKey = null; syncPlayAllBtn(); syncTurnBtns();
      try { clearHighlight(); } catch(e){}
      if (finishedOrigin === 'all') {
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){ try { window.scrollTo(0, 0); } catch(e2){} }
      }
      return;
    }
    playQueue = [...loopSource];
    later(LOOP_GAP - LINE_GAP, token);
    return;
  }
  const item = playQueue.shift();
  if (item.lineKey) highlightLine(item.lineKey);
  if (playQueue.length > 0) prefetchPath(playQueue[0].src);
  if (playQueue.length > 1) prefetchPath(playQueue[1].src);
  const a = getPlayer();
  a.onended = () => later(item.gap, token);
  a.onerror = () => later(100, token);
  a.src = srcFor(item.src);
  applyPlayRate(a);
  a.play().then(() => applyPlayRate(a)).catch(() => later(100, token));
}

function playFiles(paths, origin) {
  stop();
  playOrigin = origin || 'line';
  playQueue = [...paths];
  playing = true;
  syncPlayAllBtn();
  syncTurnBtns();
  playNext();
}

function playReg(id) {
  savePlace();
  playFiles(REG[id], 'line');
}

function togglePlayAll() {
  const id = `a_${activeLesson}_${activeSection}`;
  if (playing && playOrigin === 'all') { stop(); return; }
  savePlace();
  playFiles(REG[id], 'all');
}

function togglePlayTurn(id) {
  if (playing && playOrigin === 'turn' && playTurnKey === id) { stop(); return; }
  savePlace();
  playFiles(REG[id], 'turn');
  playTurnKey = id;
  syncTurnBtns();
}

function syncPlayAllBtn() {
  const btn = document.getElementById('play-all-btn');
  if (!btn) return;
  const on = playing && playOrigin === 'all';
  btn.classList.toggle('stopping', on);
  btn.textContent = on ? '■ Stop' : '▶ Play All';
}

function syncTurnBtns() {
  document.querySelectorAll('.play-turn-btn').forEach(btn => {
    const on = playing && playOrigin === 'turn' && btn.getAttribute('data-turn') === playTurnKey;
    btn.classList.toggle('stopping', on);
    btn.textContent = on ? '■ Stop' : '▶ Play Turn';
  });
}

function syncLoopBtn() {
  const btn = document.getElementById('loop-all-btn');
  if (!btn) return;
  const on = !!loopKey;
  btn.classList.toggle('stopping', on);
  btn.textContent = on ? '■ Stop' : '↻ Loop All';
}

function toggleLoop(id) {
  if (loopKey === id) { stop(); return; }
  savePlace();
  playFiles(REG[id], 'loop');
  loopSource = [...REG[id]];
  loopKey = id;
  syncLoopBtn();
}

function buildBlocks(lines) {
  const blocks = [];
  let cur = null;
  for (const line of lines) {
    if (!cur || cur.speaker !== line.speaker) {
      cur = { speaker: line.speaker, lines: [] };
      blocks.push(cur);
    }
    cur.lines.push(line);
  }
  return blocks;
}

let activeLesson = 0;
let activeSection = 0;
try {
  const h = parseHash();
  if (h) { activeLesson = h.lesson; activeSection = h.section; }
  else {
    const p = loadPlace();
    if (p) { activeLesson = p.lesson; activeSection = p.section; }
  }
} catch(e){}

function render() {
  const app = document.getElementById('app');
  let html = '<div class="nav-wrapper"><span class="lesson-prefix">Lesson</span><nav class="lesson-nav">';
  LESSONS.forEach((l, i) => {
    html += `<button class="lesson-btn${i===activeLesson?' active':''}" onclick="setLesson(${i})">${i+1}</button>`;
  });
  html += `</nav><div class="nav-controls"><button type="button" class="search-btn" onclick="toggleSearch()" title="Search" aria-label="Search">🔍</button>
  <details class="font-dropdown" id="font-dropdown">
    <summary title="Settings" aria-label="Settings">
      <span class="font-summary-aa">⚙</span>
      <span class="font-summary-arrow">▾</span>
    </summary>
    <div class="font-dropdown-panel">
      <div class="ctrl-row">
        <span class="ctrl-label" id="font-pct"></span>
        <button type="button" id="font-smaller" title="Smaller text">A−</button>
        <button type="button" id="font-reset" title="Default text size">A</button>
        <button type="button" id="font-larger" title="Larger text">A+</button>
      </div>
      <div class="ctrl-row">
        <button type="button" id="theme-light">Light</button>
        <button type="button" id="theme-system">System</button>
        <button type="button" id="theme-dark">Dark</button>
      </div>
      <div class="ctrl-row">
        <button type="button" id="copy-link" style="flex:1">Copy Link</button>
      </div>
      <div class="ctrl-row">
        <button type="button" id="about-link" style="flex:1">ⓘ About</button>
      </div>
    </div>
  </details>
  </div></div>`;
  const saved = loadPlace();
  if (saved && (saved.lesson !== activeLesson || saved.section !== activeSection)) {
    html += `<div class="resume-bar"><span>Last time: Lesson ${saved.lesson + 1} / ${escHtml(LESSONS[saved.lesson].sections[saved.section].label)}</span><button type="button" onclick="resumeSaved()">Resume</button></div>`;
  }
  const lesson = LESSONS[activeLesson];
  html += `<div class="lesson-header"><div class="lesson-title">${lesson.title}</div></div>`;
  html += '<div class="section-nav"><div class="section-tabs">';
  lesson.sections.forEach((s, i) => {
    html += `<button class="section-btn${i===activeSection?' active':''}" onclick="setSection(${i})">${s.label}</button>`;
  });
  html += '</div><div class="section-actions">';
  html += `<details class="speed-dropdown" id="speed-dropdown"><summary>Speed <span class="speed-dropdown-arrow">▾</span></summary><div class="speed-dropdown-panel" id="speed-dropdown-panel"><button type="button" data-rate="0.75">0.75×</button><button type="button" data-rate="1">1×</button><button type="button" data-rate="1.25">1.25×</button></div></details>`;
  html += `<button class="bar-btn" id="play-all-btn" onclick="togglePlayAll()">▶ Play All</button>`;
  html += `<button class="bar-btn" id="loop-all-btn" onclick="toggleLoop('a_${activeLesson}_${activeSection}')">↻ Loop All</button>`;
  html += `<button class="bar-btn" id="ab-btn" onclick="toggleAB()">Loop Line</button>`;
  html += '</div></div>';
  const sec = lesson.sections[activeSection];
  html += '<div class="section-content">';
  html += `<div class="section-header"><div class="section-label">${sec.label}</div><div class="section-title">${sec.title}</div></div>`;
  const blocks = buildBlocks(sec.lines);
  const allKey = `a_${activeLesson}_${activeSection}`;
  const allPairs = [];
  blocks.forEach((block, bi) => {
    block.lines.forEach((line, li) => {
      allPairs.push({ line, key: `l_${activeLesson}_${activeSection}_${bi}_${li}` });
    });
  });
  REG[allKey] = entriesForWithKeys(sec.dir, allPairs);
  blocks.forEach((block, bi) => {
    const color = COLORS[block.speaker] || '#64748b';
    const turnKey = `t_${activeLesson}_${activeSection}_${bi}`;
    REG[turnKey] = entriesForWithKeys(sec.dir, block.lines.map((line, li) => ({ line, key: `l_${activeLesson}_${activeSection}_${bi}_${li}` })));
    html += `<div class="speaker-block">`;
    html += `<div class="speaker-header">`;
    html += `<div class="speaker-name"><span class="speaker-dot" style="background:${color}"></span><span style="color:${color}">${block.speaker}</span></div>`;
    html += `<button class="play-turn-btn" data-turn="${turnKey}" style="color:${color};border-color:${color}" onclick="togglePlayTurn('${turnKey}')">▶ Play Turn</button>`;
    html += `</div>`;
    block.lines.forEach((line, li) => {
      const lineKey = `l_${activeLesson}_${activeSection}_${bi}_${li}`;
      REG[lineKey] = entriesForWithKeys(sec.dir, [{ line, key: lineKey }]);
      html += `<div class="line-row" data-line="${lineKey}">`;
      html += `<div class="line-text">${renderLineText(line.text)}</div>`;
      html += `<div class="line-actions">`;
      html += `<button class="play-line-btn" style="background:${color}" onclick="playReg('${lineKey}')">▶</button>`;
      html += `<button type="button" class="tr-line-btn" data-en="${escHtml(line.en || '')}">EN</button>`;
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  app.innerHTML = html;
  hideDefBubble();
  bindLookups();
  bindSpeedMenu();
  syncLoopBtn();
  syncPlayAllBtn();
  syncTurnBtns();
  syncABBtn();
  const cb = document.getElementById('copy-link');
  if (cb) cb.onclick = function(e){ e.preventDefault(); e.stopPropagation(); copyLessonLink(); };
  const ab = document.getElementById('about-link');
  if (ab) ab.onclick = function(e){ e.preventDefault(); e.stopPropagation(); openAbout(); };
  updateHash();
  warmSection(REG[allKey]);
}

function setLesson(i) { activeLesson = i; activeSection = 0; stop(); savePlace(); render(); controlsInit(); }
function setSection(i) { activeSection = i; stop(); savePlace(); render(); controlsInit(); }

render();

(function(){
  var FK="koreanFontScale", FDEF=1, FMIN=0.8, FMAX=1.8, FSTEP=0.1;
  function frd(x){ return Math.round(x*100)/100; }
  function fget(){ var v=parseFloat(localStorage.getItem(FK)); return isNaN(v)?FDEF:frd(Math.min(FMAX,Math.max(FMIN,v))); }
  function fapply(s){
    s=frd(Math.min(FMAX,Math.max(FMIN,s)));
    document.documentElement.style.setProperty("--font-scale",String(s));
    try{ localStorage.setItem(FK,String(s)); }catch(e){}
    var pct=document.getElementById("font-pct");
    var sm=document.getElementById("font-smaller");
    var lg=document.getElementById("font-larger");
    if(pct) pct.textContent=Math.round(s*100)+"%";
    if(sm) sm.disabled=s<=FMIN+0.001;
    if(lg) lg.disabled=s>=FMAX-0.001;
  }
  var TK="koreanTheme";
  function tget(){ return localStorage.getItem(TK)||"system"; }
  function tapply(t){
    try{ localStorage.setItem(TK,t); }catch(e){}
    if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    else if(t==="light") document.documentElement.setAttribute("data-theme","light");
    else document.documentElement.removeAttribute("data-theme");
    ["light","system","dark"].forEach(function(x){
      var b=document.getElementById("theme-"+x);
      if(b) b.onclick=function(e){ e.preventDefault(); tapply(x); };
    });
    const si = document.getElementById('search-input');
    if (si && !si.dataset.bound) {
      si.dataset.bound = '1';
      si.addEventListener('input', () => doSearch(si.value));
    }
  };
  controlsInit();
})();
</script>
